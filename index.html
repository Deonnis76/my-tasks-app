<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Поиск рабочих моделей</title>
<style>
body { font-family: Arial; background: #1a1a2e; color: white; padding: 30px; max-width: 800px; margin: 0 auto; }
h1 { color: #667eea; }
.box { background: #16213e; padding: 20px; border-radius: 10px; margin: 15px 0; }
button { background: #667eea; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 5px; }
pre { background: #0f3460; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 13px; white-space: pre-wrap; }
.ok { color: #4CAF50; }
.err { color: #ff4b4b; }
.model-item { background: #0f3460; padding: 10px; margin: 5px 0; border-radius: 5px; font-family: monospace; }
</style>
</head>
<body>
<h1>🔍 Поиск рабочих моделей Gemini</h1>

<div class="box">
<h2>Шаг 1: Получаю список всех доступных моделей</h2>
<button onclick="listModels()">Получить список моделей</button>
<div id="modelsResult"></div>
</div>

<div class="box">
<h2>Шаг 2: Тестирование моделей</h2>
<p>Нажмите чтобы проверить каждую модель:</p>
<div id="testButtons"></div>
<div id="testResult"></div>
</div>

<script>
var _p1 = 'AQ.Ab8RN6J20JFrZkONjLdSsHz_';
var _p2 = 'zL6RzXy0WQRnghJgq0WT0h-';
var _p3 = '56w';
var API_KEY = _p1 + _p2 + _p3;

function listModels() {
    var result = document.getElementById('modelsResult');
    result.innerHTML = '<p>Загружаю...</p>';
    
    fetch('https://generativelanguage.googleapis.com/v1/models?key=' + API_KEY)
    .then(function(r) { 
        result.innerHTML += '<p>HTTP: ' + r.status + '</p>';
        return r.json(); 
    })
    .then(function(data) {
        if (data.models) {
            result.innerHTML += '<p class="ok">Найдено моделей: ' + data.models.length + '</p>';
            var flash = data.models.filter(function(m) { 
                return m.name.indexOf('flash') >= 0 || m.name.indexOf('gemini') >= 0; 
            });
            result.innerHTML += '<p>Модели с "flash" или "gemini" в названии:</p>';
            flash.forEach(function(m) {
                result.innerHTML += '<div class="model-item">' + m.name + ' <button onclick="testModel(\'' + m.name + '\')">Тест</button></div>';
            });
        } else {
            result.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        }
    })
    .catch(function(e) {
        result.innerHTML += '<p class="err">Ошибка: ' + e.message + '</p>';
    });
}

function testModel(modelName) {
    var result = document.getElementById('testResult');
    result.innerHTML += '<p>Тестирую ' + modelName + '...</p>';
    
    fetch('https://generativelanguage.googleapis.com/v1/' + modelName + ':generateContent?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: 'Напиши одно слово: привет' }] }]
        })
    })
    .then(function(r) { 
        result.innerHTML += '<p>HTTP: ' + r.status + '</p>';
        return r.json(); 
    })
    .then(function(data) {
        if (data.candidates && data.candidates[0]) {
            var text = data.candidates[0].content.parts[0].text;
            result.innerHTML += '<p class="ok">✅ РАБОТАЕТ! Ответ: ' + text + '</p>';
        } else {
            result.innerHTML += '<p class="err"> Не работает: ' + JSON.stringify(data.error || data).substring(0, 200) + '</p>';
        }
    })
    .catch(function(e) {
        result.innerHTML += '<p class="err">Ошибка: ' + e.message + '</p>';
    });
}
</script>
</body>
</html>
