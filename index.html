<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Задачи</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        button { width: 100%; padding: 20px; margin-bottom: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .mic-btn { background: white; color: #667eea; }
        .add-btn { background: #4CAF50; color: white; }
        .status { text-align: center; color: white; margin-bottom: 15px; min-height: 20px; }
        .task-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .task-text { flex: 1; font-size: 16px; }
        .delete-btn { background: #ff4b4b; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; }
        .empty { text-align: center; color: white; padding: 40px; font-size: 18px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 15px; padding: 25px; max-width: 500px; width: 100%; }
        .modal-content h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-cancel { background: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Мои Задачи</h1>
        <button class="mic-btn" id="micBtn">🎙️ Нажми и скажи задачу</button>
        <button class="add-btn" id="addBtn">➕ Добавить задачу вручную</button>
        <p class="status" id="status"></p>
        <div id="taskList"></div>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h2>Новая задача</h2>
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="taskText" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Когда напомнить:</label>
                <select id="reminderPreset">
                    <option value="">Без напоминания</option>
                    <option value="today">Сегодня (20:00)</option>
                    <option value="tomorrow">Завтра (09:00)</option>
                    <option value="week">Через неделю</option>
                    <option value="month">Через месяц</option>
                    <option value="year">Через год</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
                <button class="btn btn-save" id="saveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const addBtn = document.getElementById('addBtn');
        const status = document.getElementById('status');
        const taskList = document.getElementById('taskList');
        const taskModal = document.getElementById('taskModal');
        const taskText = document.getElementById('taskText');
        const reminderPreset = document.getElementById('reminderPreset');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        console.log('micBtn:', micBtn);
        console.log('addBtn:', addBtn);

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
        }

        micBtn.addEventListener('click', function() {
            console.log('Микрофон нажат!');
            if (!recognition) {
                alert('Голосовой ввод не поддерживается. Используйте Chrome.');
                return;
            }
            status.textContent = '🎤 Слушаю...';
            recognition.start();
        });

        if (recognition) {
            recognition.addEventListener('result', function(e) {
                const text = e.results[0][0].transcript;
                status.textContent = '✓ ' + text;
                taskText.value = text;
                taskModal.classList.add('active');
            });
            recognition.addEventListener('end', function() {
                if (status.textContent === '🎤 Слушаю...') status.textContent = '';
            });
        }

        addBtn.addEventListener('click', function() {
            console.log('Добавить вручную нажат!');
            taskText.value = '';
            reminderPreset.value = '';
            taskModal.classList.add('active');
        });

        cancelBtn.addEventListener('click', function() {
            taskModal.classList.remove('active');
        });

        saveBtn.addEventListener('click', function() {
            const text = taskText.value.trim();
            if (!text) { alert('Введите текст задачи'); return; }

            let reminderDate = null;
            const preset = reminderPreset.value;
            const now = new Date();

            if (preset === 'today') {
                reminderDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 20, 0);
            } else if (preset === 'tomorrow') {
                reminderDate = new Date(now.getTime() + 24*60*60*1000);
                reminderDate.setHours(9, 0, 0, 0);
            } else if (preset === 'week') {
                reminderDate = new Date(now.getTime() + 7*24*60*60*1000);
            } else if (preset === 'month') {
                reminderDate = new Date(now.getTime() + 30*24*60*60*1000);
            } else if (preset === 'year') {
                reminderDate = new Date(now.getTime() + 365*24*60*60*1000);
            }

            tasks.push({
                id: Date.now(),
                text: text,
                reminderDate: reminderDate ? reminderDate.getTime() : null,
                done: false,
                notified: false
            });

            localStorage.setItem('tasks', JSON.stringify(tasks));
            taskModal.classList.remove('active');
            renderTasks();
        });

        function renderTasks() {
            if (tasks.length === 0) {
                taskList.innerHTML = '<p class="empty">Нет задач. Добавьте первую!</p>';
                return;
            }
            taskList.innerHTML = '';
            tasks.forEach(function(task) {
                const div = document.createElement('div');
                div.className = 'task-item';
                div.innerHTML = '<span class="task-text">' + task.text + '</span><button class="delete-btn" data-id="' + task.id + '">✕</button>';
                taskList.appendChild(div);
            });

            document.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const id = parseInt(this.getAttribute('data-id'));
                    tasks = tasks.filter(t => t.id !== id);
                    localStorage.setItem('tasks', JSON.stringify(tasks));
                    renderTasks();
                });
            });
        }

        renderTasks();
        console.log('Приложение загружено. Задач:', tasks.length);
    </script>
</body>
</html>
