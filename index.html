<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диагностика API ключа</title>
<style>
body { font-family: Arial; background: #1a1a2e; color: white; padding: 30px; max-width: 700px; margin: 0 auto; }
h1 { color: #667eea; }
.box { background: #16213e; padding: 20px; border-radius: 10px; margin: 15px 0; }
.ok { color: #4CAF50; font-size: 18px; }
.err { color: #ff4b4b; font-size: 16px; }
.key { background: #0f3460; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 14px; word-break: break-all; margin: 10px 0; }
button { background: #667eea; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 10px 5px; }
button:hover { background: #5a6fd6; }
pre { background: #0f3460; padding: 15px; border-radius: 5px; overflow-x: auto; font-size: 13px; }
</style>
</head>
<body>
<h1> Диагностика API ключа Gemini</h1>

<div class="box">
<h2>Шаг 1: Текущий ключ в коде</h2>
<p>Ключ собирается из 3 частей:</p>
<div class="key" id="keyDisplay"></div>
<p>Длина ключа: <span id="keyLength"></span> символов</p>
<p>Содержит спецсимволы: <span id="specialChars"></span></p>
</div>

<div class="box">
<h2>Шаг 2: Проверка ключа</h2>
<button onclick="testKey()">Проверить ключ</button>
<button onclick="testSimple()">Простой тест (текст)</button>
<div id="result"></div>
</div>

<div class="box">
<h2>Шаг 3: Что делать</h2>
<div id="advice"></div>
</div>

<script>
var _p1 = 'AQ.Ab8RN6lsp1dxtd';
var _p2 = '2Yz6k1QYBtH04v-P';
var _p3 = 'By6ifXbEurW3\u00d78q_lxJw';
var API_KEY = _p1 + _p2 + _p3;

document.getElementById('keyDisplay').textContent = API_KEY;
document.getElementById('keyLength').textContent = API_KEY.length;

var specials = API_KEY.match(/[^\w\-._~]/g);
document.getElementById('specialChars').textContent = specials ? specials.join(', ') + ' (коды: ' + specials.map(function(c){return c.charCodeAt(0)}).join(', ') + ')' : 'нет';

function testKey() {
    var result = document.getElementById('result');
    result.innerHTML = '<p>Проверяю...</p>';
    
    fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: 'Привет' }] }]
        })
    })
    .then(function(r) { 
        result.innerHTML += '<p>HTTP статус: ' + r.status + '</p>';
        return r.json(); 
    })
    .then(function(data) {
        result.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
        
        if (data.error) {
            var msg = data.error.message;
            if (msg.indexOf('not valid') >= 0) {
                document.getElementById('advice').innerHTML = '<p class="err">КЛЮЧ НЕДЕЙСТВИТЕЛЕН. Причина: Google отклоняет ключ.</p><p>Возможные причины:</p><ul><li>Ключ содержит символ × (умножение) — возможно он был скопирован неправильно</li><li>Ключ заблокирован после публикации в открытом репозитории</li><li>Ключ требует привязки к проекту</li></ul><p><strong>Решение:</strong> Создайте новый ключ на https://aistudio.google.com/app/apikey и убедитесь что он начинается с AIza (не AQ)</p>';
            } else if (msg.indexOf('model') >= 0) {
                document.getElementById('advice').innerHTML = '<p class="err">МОДЕЛЬ НЕ НАЙДЕНА. Ключ работает, но модель gemini-3.8-flash не существует.</p><p>Нужно использовать другую модель.</p>';
            } else {
                document.getElementById('advice').innerHTML = '<p class="err">Другая ошибка: ' + msg + '</p>';
            }
        } else {
            document.getElementById('advice').innerHTML = '<p class="ok">КЛЮЧ РАБОТАЕТ! Проблема была в модели.</p>';
        }
    })
    .catch(function(e) {
        result.innerHTML += '<p class="err">Ошибка сети: ' + e.message + '</p>';
    });
}

function testSimple() {
    var result = document.getElementById('result');
    result.innerHTML = '<p>Простой тест с моделью gemini-2.0-flash...</p>';
    
    fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + API_KEY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{ parts: [{ text: 'Привет' }] }]
        })
    })
    .then(function(r) { 
        result.innerHTML += '<p>HTTP статус: ' + r.status + '</p>';
        return r.json(); 
    })
    .then(function(data) {
        result.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
    })
    .catch(function(e) {
        result.innerHTML += '<p class="err">Ошибка: ' + e.message + '</p>';
    });
}
</script>
</body>
</html>
