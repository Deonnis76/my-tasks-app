<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Задачи</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: white; text-align: center; margin-bottom: 20px; }
        
        .mic-btn { width: 100%; padding: 20px; margin-bottom: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: white; color: #667eea; }
        .mic-btn.recording { background: #ff4b4b; color: white; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        .add-btn { width: 100%; padding: 20px; margin-bottom: 15px; border: none; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: #4CAF50; color: white; }
        
        .status { text-align: center; color: white; margin-bottom: 15px; min-height: 20px; font-size: 14px; }
        
        .task-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; }
        .task-text { font-size: 16px; margin-bottom: 10px; word-break: break-word; }
        .task-meta { font-size: 12px; color: #888; margin-bottom: 10px; }
        .task-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .task-btn { padding: 8px 14px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-edit { background: #2196F3; color: white; }
        .btn-delete { background: #ff4b4b; color: white; }
        .btn-done { background: #4CAF50; color: white; }
        .task-done .task-text { text-decoration: line-through; color: #999; }
        
        .empty { text-align: center; color: white; padding: 40px; font-size: 18px; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 15px; padding: 25px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #4CAF50; color: white; }
        .btn-cancel { background: #ddd; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Мои Задачи</h1>
        <button class="mic-btn" id="micBtn">🎙️ Начать запись</button>
        <button class="add-btn" id="addBtn">➕ Добавить задачу вручную</button>
        <p class="status" id="status"></p>
        <div id="taskList"></div>
    </div>

    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h2 id="modalTitle">Новая задача</h2>
            <div class="form-group">
                <label>Описание:</label>
                <textarea id="taskText" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>Когда напомнить:</label>
                <select id="reminderPreset">
                    <option value="">Без напоминания</option>
                    <option value="today">Сегодня (20:00)</option>
                    <option value="tomorrow">Завтра (09:00)</option>
                    <option value="week">Через неделю</option>
                    <option value="month">Через месяц</option>
                    <option value="year">Через год</option>
                </select>
            </div>
            <div class="btn-row">
                <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
                <button class="btn btn-save" id="saveBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const addBtn = document.getElementById('addBtn');
        const status = document.getElementById('status');
        const taskList = document.getElementById('taskList');
        const taskModal = document.getElementById('taskModal');
        const modalTitle = document.getElementById('modalTitle');
        const taskText = document.getElementById('taskText');
        const reminderPreset = document.getElementById('reminderPreset');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let editingTaskId = null;
        let isRecording = false;
        let currentTranscript = '';

        // Запрос разрешения на уведомления
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Голосовое распознавание
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = true; // Важно: непрерывный режим

            recognition.addEventListener('result', function(e) {
                // Собираем весь распознанный текст
                let fullText = '';
                for (let i = 0; i < e.results.length; i++) {
                    fullText += e.results[i][0].transcript + ' ';
                }
                currentTranscript = fullText.trim();
                status.textContent = '🎤 Записано: ' + currentTranscript;
            });

            recognition.addEventListener('end', function() {
                // Если пользователь не нажал "Закончить", перезапускаем
                if (isRecording) {
                    try { recognition.start(); } catch(e) {}
                }
            });

            recognition.addEventListener('error', function(e) {
                console.error('Ошибка распознавания:', e.error);
                if (e.error !== 'no-speech' && e.error !== 'aborted') {
                    status.textContent = 'Ошибка: ' + e.error;
                }
            });
        } else {
            micBtn.disabled = true;
            micBtn.textContent = '🎙️ Голос не поддерживается (используйте Chrome)';
        }

        // Кнопка микрофона - переключение запись/стоп
        micBtn.addEventListener('click', function() {
            if (!recognition) return;

            if (!isRecording) {
                // НАЧАТЬ ЗАПИСЬ
                currentTranscript = '';
                isRecording = true;
                micBtn.textContent = '️ Закончить запись';
                micBtn.classList.add('recording');
                status.textContent = ' Говорите... Нажмите кнопку когда закончите';
                try { recognition.start(); } catch(e) {}
            } else {
                // ЗАКОНЧИТЬ ЗАПИСЬ
                isRecording = false;
                micBtn.textContent = '️ Начать запись';
                micBtn.classList.remove('recording');
                try { recognition.stop(); } catch(e) {}

                if (currentTranscript) {
                    status.textContent = '✓ Распознано: ' + currentTranscript;
                    // Открываем модальное окно с
